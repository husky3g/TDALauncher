name: Release

# Push a tag like v1.2.0 (matching AppVersion.Text in src/Version.cs) to build TDALauncher.exe
# and publish it as a GitHub release. Installed launchers update themselves from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        shell: powershell
        run: |
          $v = [regex]::Match((Get-Content src\Version.cs -Raw), 'Text = "([^"]+)"').Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "src\Version.cs says $v but the tag is ${{ github.ref_name }}" }

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/TDALauncher.exe --title "TDA Launcher ${{ github.ref_name }}" --generate-notes
